name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "主仓库 git tag，如 v1.0.0"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fffirer/aiworkbench

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main repo from Gitea
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch ${{ inputs.tag }} \
            https://oauth2:${MAIN_REPO_TOKEN}@gitea.private.fffirer.top:9081/workbench/MinGo.AIWorkbench.git .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip v prefix from tag
        id: version
        run: echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
