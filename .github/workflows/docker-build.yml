name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "主仓库 git tag，如 v1.0.0"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fffirer/aiworkbench

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: FFFirer/MinGo.AIWorkbench
          ref: ${{ inputs.tag }}
          submodules: recursive
          # 跨仓库 checkout 需要 PAT（fine-grained token 含 Contents: Read 权限）
          # 在 DevOps 仓库 Settings > Secrets 中配置 MAIN_REPO_TOKEN
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
